<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub | Login</title>
    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ================= HEADER ================= -->
    <header>
        <div class="logo">
            <span>Student Hub</span>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="signup.html">Sign Up</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <!-- ================= LOGIN ================= -->
    <section class="login-section">
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Login to your Student Hub account</p>
            <!-- LOGIN FORM -->
            <form action="dashboard.html" method="get">
                <!-- Email -->
                <label for="email">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
                <!-- Password -->
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
                <!-- Forgot Password -->
                <a href="#" class="forgot-password">
                    Forgot Password?
                </a>
                <!-- LOGIN BUTTON -->
                <button type="submit">
                    Login
                </button>
            </form>
            <!-- SIGN UP -->
            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">
                    Sign Up
                </a>
            </p>
        </div>
    </section>
    <!-- ================= FOOTER ================= -->
    <footer>
        <div class="footer-content">
            <div>
                <h3>Student Hub</h3>
                <p>
                    Your one-stop platform for managing
                    your academic journey.
                </p>
            </div>
            <div>
                <h3>Quick Links</h3>
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="signup.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
        <hr>
        <p class="copyright"> 2026 Student Hub. All Rights Reserved.
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
